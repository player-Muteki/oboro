<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 192'>
  <!-- Master drawing, light selected palette. All four embedded variants share this geometry.
       No paper/background, noise filters or shadows: pigment stays on branch and flowers. -->
